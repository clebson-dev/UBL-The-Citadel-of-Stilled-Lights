[package]
name = "ubl-citadel"
version = "1.0.0"
description = "UBL The Citadel of Stilled Lights"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ubl_citadel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
